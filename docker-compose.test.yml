services:
  postgres-test:
    image: postgres:18-alpine
    container_name: afos-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_DB: afos_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afos_test"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - afos_test_postgres_data:/var/lib/postgresql

volumes:
  afos_test_postgres_data: